<!DOCTYPE html><html lang=ar dir=rtl><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>مدرستي</title><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script><style>body{font-family:sans-serif;background:#f0f2f5;margin:0;padding:10px}.card{background:#fff;padding:12px;border-radius:12px;margin-bottom:10px}input,select{width:100%;padding:11px;margin:5px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}.yellow{background:#fff8c4;border:2px solid #fbbf24!important}button{width:100%;padding:11px;border:0;border-radius:8px;font-weight:bold;color:#fff;background:#008069;margin:4px 0;cursor:pointer}.small{font-size:11px;color:#666}.badge{padding:4px 10px;border-radius:20px;color:#fff;font-size:12px}.item{border-top:1px solid #eee;padding:10px 0}</style></head><body>
<div id="lock" style="position:fixed;inset:0;background:#008069;display:flex;align-items:center;justify-content:center;z-index:999"><div class="card" style="width:90%;max-width:320px;text-align:center"><h2>📖 مدرستي</h2><p id="cs" style="font-size:11px;color:green"></p><input id="pass" type="password" placeholder="كلمة السر"><button onclick="login()">دخول</button><p id="err" style="color:red;font-size:12px"></p></div></div>
<div id="app" style="display:none;max-width:520px;margin:auto"><div class="card" style="display:flex;justify-content:space-between"><span id="rb"></span><button onclick="location.reload()" style="width:auto;background:red;padding:5px 10px">خروج</button></div>
<div style="display:flex;gap:6px"><button onclick="show('S')" id="bS" style=flex:1;background:#111>طلاب</button><button onclick=show('T') id=bT style=flex:1;background:#fff;color:#000;border:1px solid #ddd>أساتذة</button></div>
<div id="secS" class="card"><div id="addSForm"><h3>➕ طالب جديد</h3><input id="sN" placeholder="اسم الطالب *"><input id="sC" placeholder="الفصل"><input id="sPN" class="yellow" placeholder="اسم ولي الأمر *"><input id="sPP" class="yellow" placeholder="رقم ولي الأمر *"><input id="sT" type="number" placeholder="الرسوم"><button onclick="addS()">حفظ</button><hr></div><input id="q" placeholder="بحث..." oninput="renderS()"><div id="listS">تحميل...</div></div>
<div id="secT" class="card" style="display:none"><div id="addTForm"><h3>➕ أستاذ جديد</h3><input id="tN" placeholder="اسم الأستاذ *"><input id="tS" placeholder="؟"><input id="tP" class="yellow" placeholder="رقم"><button onclick="addT()" style="background:#f59e0b">حفظ</button><hr></div><div id="listT"></div></div>
<div id="payBox" class="card" style="display:none;border:2px solid #16a34a"><h3>💰 <span id="payName"></span></h3><p id="payInfo" class="yellow" style=padding:8px;border-radius:8px;font-size:12px></p><p id="paySum" class="small"></p><div id="payAdmin"><div style=display:flex;gap:6px><select id="payM" style=flex:1><option>يناير</option><option>فبراير</option><option>مارس</option><option>أبسبريل</option><option>مايو</option><option>يونيو</option><option>يوليو</option><option>أغسطس</option><option selected>سبتمبر </option><option>أكتوبر</option><option>نوفمبر</option><option>ديسمبر</option></select><input id="payA" type="number" placeholder="المبلغ" style=width:40%></div><button onclick="addPay()" style=background:#16a34a>تأكيد</button></div><div id="payList"></div><button onclick=closePay() style=background:#eee;color:#000>إغلاق</button></div>
<div id=editBox class=card style=display:none;border:2px solid #111><h3>تعديل</h3><input id=e1><input id=e2><input id=e3 class=yellow><input id=e4><button onclick=saveEdit() style=background:#111>حفظ</button><button onclick=closeEdit() style=background:#eee;color:#000>إلغاء</button></div>
<div class=card style=text-align:center;background:#25D366><a href=https://wa.me/249911123248 style=color:white;text-decoration:none;font-weight:bold>💬 واتساب الإدارة 0911123248</a></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyBBETb-J2crf_v6_BIwGMkkoa6CmSwH-4",authDomain:"madrasati-khrtom.firebaseapp.com",projectId:"madrasati-khrtom"};
try{firebase.initializeApp(firebaseConfig);var db=firebase.firestore();}catch(e){}
let role='',curId=null,editId=null,editType='';let students=[],teachers=[];
db.collection('students').orderBy('createdAt','desc').onSnapshot(s=>{students=[];s.forEach(d=>{students.push({id:d.id,...d.data()})});if(role)renderS();document.getElementById('cs').innerText='متصل - '+students.length;});
db.collection('teachers').orderBy('createdAt','desc').onSnapshot(s=>{teachers=[];s.forEach(d=>{teachers.push({id:d.id,...d.data()})});if(role)renderT();});
function login(){
let p=document.getElementById('pass').value.trim();
if(p=='099919')role='admin';
else if(p=='11100')role='teacher';
else if(p=='001234')role='parent';
else{document.getElementById('err').innerText='كلمة السر غلط';return}
document.getElementById('lock').style.display='none';
document.getElementById('app').style.display='block';
let a=role=='admin';
let rb=document.getElementById('rb');
if(a){rb.innerHTML='<span class=badge style=background:green>مدير 👑</span>'}
else if(role=='teacher'){rb.innerHTML='<span class=badge style=background:blue>معلم 👨‍🏫</span>'}
else{rb.innerHTML='<span class=badge style=background:#ff9800>ولي أمر 👨‍👩‍👦</span>'}
document.getElementById('addSForm').style.display=a?'block':'none';
document.getElementById('addTForm').style.display=a?'block':'none';
document.getElementById('payAdmin').style.display=a?'block':'none';
renderS();renderT()
}
function show(x){document.getElementById('secS').style.display=x=='S'?'block':'none';document.getElementById('secT').style.display=x=='T'?'block':'none';document.getElementById('payBox').style.display='none';}
function addS(){let n=document.getElementById('sN').value.trim(),pn=document.getElementById('sPN').value.trim(),pp=document.getElementById('sPP').value.trim();if(!n||!pn||!pp)return alert('املا البيانات');db.collection('students').add({n:n,c:document.getElementById('sC').value,pn:pn,pp:pp,total:+document.getElementById('sT').value||0,pays:[],createdAt:firebase.firestore.FieldValue.serverTimestamp()});document.getElementById('sN').value=document.getElementById('sC').value=document.getElementById('sPN').value=document.getElementById('sPP').value=document.getElementById('sT').value='';}
function addT(){let n=document.getElementById('tN').value.trim();if(!n)return alert('الاسم');db.collection('teachers').add({n:n,s:document.getElementById('tS').value,pp:document.getElementById('tP').value,createdAt:firebase.firestore.FieldValue.serverTimestamp()});document.getElementById('tN').value=document.getElementById('tS').value=document.getElementById('tP').value='';}
function renderS(){let qq=(document.getElementById('q').value||'').toLowerCase();let a=role=='admin';let h='';students.filter(x=>x.n.toLowerCase().includes(qq)).forEach(s=>{let paid=(s.pays||[]).reduce((x,y)=>x+y.a,0);h+=`<div class=item onclick="openPay('${s.id}')"><div><b>${s.n}</b> - ${s.c||''}<br><span class=small>${a?s.pn+' | '+s.pp:'مخفي'} | مدفوع:${paid}</span></div></div>`});document.getElementById('listS').innerHTML=h||'لا طلاب'}
function renderT(){let h='';teachers.forEach(t=>{h+=`<div class=item><div><b>${t.n}</b><br><span class=small>${t.s||'-'}</span></div></div>`});document.getElementById('listT').innerHTML=h||'لا أساتذة'}
function delS(i){if(confirm('حذف؟'))db.collection('students').doc(i).delete()}function delT(i){if(confirm('حذف؟'))db.collection('teachers').doc(i).delete()}
function openPay(id){curId=id;let s=students.find(x=>x.id==id);document.getElementById('payName').innerText=s.n;document.getElementById('payInfo').innerText=s.pn+' - '+s.pp;let paid=(s.pays||[]).reduce((a,b)=>a+b.a,0);document.getElementById('paySum').innerText=`الكلي:${s.total} مدفوع:${paid} باقي:${s.total-paid}`;document.getElementById('secS').style.display='none';document.getElementById('secT').style.display='none';document.getElementById('payBox').style.display='block';renderPay()}
function closePay(){document.getElementById('payBox').style.display='none';show('S')}
function addPay(){let m=document.getElementById('payM').value,a=+document.getElementById('payA').value;if(!a)return;let s=students.find(x=>x.id==curId);let np=[{m:m,a:a,d:new Date().toLocaleDateString()},...(s.pays||[])];db.collection('students').doc(curId).update({pays:np});document.getElementById('payA').value='';}
function renderPay(){let s=students.find(x=>x.id==curId);document.getElementById('payList').innerHTML=(s.pays||[]).map(p=>`<div style=display:flex;justify-content:space-between;background:#f8f9fa;padding:5px;border-radius:6px;margin:2px 0;font-size:12px><span>${p.m}</span><b>${p.a}</b></div>`).join('');}
function openEditS(id){let s=students.find(x=>x.id==id);editId=id;editType='S';document.getElementById('editBox').style.display='block';document.getElementById('e1').value=s.n;document.getElementById('e2').value=s.c;document.getElementById('e3').value=s.pn;document.getElementById('e4').value=s.pp;}
function saveEdit(){if(editType=='S')db.collection('students').doc(editId).update({n:document.getElementById('e1').value,c:document.getElementById('e2').value,pn:document.getElementById('e3').value,pp:document.getElementById('e4').value});else db.collection('teachers').doc(editId).update({n:document.getElementById('e1').value,s:document.getElementById('e2').value,pp:document.getElementById('e3').value});closeEdit();}
function closeEdit(){document.getElementById('editBox').style.display='none';}
</script></body></html>
